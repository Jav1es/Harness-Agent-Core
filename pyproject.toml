[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent-core"
version = "0.1.0"
description = "Enterprise-grade deterministic harness for multi-agent tool orchestration, guardrails, self-healing and CI gates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jav1es" }]
keywords = ["harness", "agents", "llm", "mcp", "guardrails", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Zero runtime dependencies: the whole engine must run offline, in CI, with no network.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
stdio = ["mcp>=1.0"]
# Opt-in control-flow backend. Not installed by default: the package must stay
# importable and fully testable with zero dependencies.
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
harness-core = "harness_core.cli:main"

[tool.setuptools.packages.find]
include = ["harness_core*"]

[tool.setuptools.package-data]
harness_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
